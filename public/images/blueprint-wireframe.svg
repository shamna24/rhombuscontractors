<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" fill="none">
  <!-- Blueprint Technical Architectural Wireframe -->
  <defs>
    <linearGradient id="blueprintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B8B9B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#4B5B6D" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Foundation Ground Grid (faint construction lines) -->
  <g stroke="#C2CBD4" stroke-width="0.8" stroke-dasharray="2,3" opacity="0.7">
    <line x1="50" y1="360" x2="220" y2="400" />
    <line x1="100" y1="330" x2="270" y2="370" />
    <line x1="150" y1="300" x2="320" y2="340" />
    <line x1="200" y1="270" x2="370" y2="310" />

    <line x1="50" y1="360" x2="200" y2="270" />
    <line x1="105" y1="373" x2="255" y2="283" />
    <line x1="160" y1="386" x2="310" y2="296" />
    <line x1="220" y1="400" x2="370" y2="310" />
  </g>

  <!-- Main Structural Columns (Verticals) -->
  <g stroke="#7C8F9F" stroke-width="1.4">
    <!-- Col 1 (Front Left) -->
    <line x1="60" y1="355" x2="60" y2="150" />
    <!-- Col 2 (Front Center) -->
    <line x1="140" y1="375" x2="140" y2="170" />
    <!-- Col 3 (Front Right) -->
    <line x1="220" y1="395" x2="220" y2="190" />
    
    <!-- Col 4 (Mid Left) -->
    <line x1="120" y1="315" x2="120" y2="110" />
    <!-- Col 5 (Mid Center) -->
    <line x1="200" y1="335" x2="200" y2="130" />
    <!-- Col 6 (Mid Right) -->
    <line x1="280" y1="355" x2="280" y2="150" />

    <!-- Col 7 (Back Left) -->
    <line x1="180" y1="275" x2="180" y2="70" />
    <!-- Col 8 (Back Center) -->
    <line x1="260" y1="295" x2="260" y2="90" />
    <!-- Col 9 (Back Right) -->
    <line x1="340" y1="315" x2="340" y2="110" />
  </g>

  <!-- Horizontal Floor Beams - Level 1 (Ground / Base) -->
  <g stroke="#8B9CAE" stroke-width="1.2">
    <line x1="60" y1="355" x2="220" y2="395" />
    <line x1="60" y1="355" x2="180" y2="275" />
    <line x1="180" y1="275" x2="340" y2="315" />
    <line x1="220" y1="395" x2="340" y2="315" />
    <!-- Mid lines -->
    <line x1="140" y1="375" x2="260" y2="295" />
    <line x1="120" y1="315" x2="280" y2="355" />
  </g>

  <!-- Horizontal Floor Beams - Level 2 -->
  <g stroke="#8B9CAE" stroke-width="1.2">
    <line x1="60" y1="287" x2="220" y2="327" />
    <line x1="60" y1="287" x2="180" y2="207" />
    <line x1="180" y1="207" x2="340" y2="247" />
    <line x1="220" y1="327" x2="340" y2="247" />
    <line x1="140" y1="307" x2="260" y2="227" />
    <line x1="120" y1="247" x2="280" y2="287" />
  </g>

  <!-- Horizontal Floor Beams - Level 3 -->
  <g stroke="#8B9CAE" stroke-width="1.2">
    <line x1="60" y1="219" x2="220" y2="259" />
    <line x1="60" y1="219" x2="180" y2="139" />
    <line x1="180" y1="139" x2="340" y2="179" />
    <line x1="220" y1="259" x2="340" y2="179" />
    <line x1="140" y1="239" x2="260" y2="159" />
    <line x1="120" y1="179" x2="280" y2="219" />
  </g>

  <!-- Roof Beams - Level 4 (Top) -->
  <g stroke="#64748B" stroke-width="1.4">
    <line x1="60" y1="150" x2="220" y2="190" />
    <line x1="60" y1="150" x2="180" y2="70" />
    <line x1="180" y1="70" x2="340" y2="110" />
    <line x1="220" y1="190" x2="340" y2="110" />
    <line x1="140" y1="170" x2="260" y2="90" />
    <line x1="120" y1="110" x2="280" y2="150" />
  </g>

  <!-- Diagonal X-Braces (Steel K-Braces and Cross-Ties) -->
  <g stroke="#A6B5C3" stroke-width="0.9" opacity="0.85">
    <!-- Level 1 Front Bays -->
    <line x1="60" y1="355" x2="140" y2="307" />
    <line x1="140" y1="375" x2="60" y2="287" />
    <line x1="140" y1="375" x2="220" y2="327" />
    <line x1="220" y1="395" x2="140" y2="307" />

    <!-- Level 2 Front Bays -->
    <line x1="60" y1="287" x2="140" y2="239" />
    <line x1="140" y1="307" x2="60" y2="219" />
    <line x1="140" y1="307" x2="220" y2="259" />
    <line x1="220" y1="327" x2="140" y2="239" />

    <!-- Level 3 Front Bays -->
    <line x1="60" y1="219" x2="140" y2="170" />
    <line x1="140" y1="239" x2="60" y2="150" />
    <line x1="140" y1="239" x2="220" y2="190" />
    <line x1="220" y1="259" x2="140" y2="170" />
    
    <!-- Right side cross braces -->
    <line x1="220" y1="395" x2="280" y2="287" />
    <line x1="280" y1="355" x2="220" y2="327" />
    <line x1="220" y1="327" x2="280" y2="219" />
    <line x1="280" y1="287" x2="220" y2="259" />
  </g>

  <!-- Structural Nodes (Bolted Connection Dots) -->
  <g fill="#475569">
    <circle cx="60" cy="150" r="2.2" />
    <circle cx="140" cy="170" r="2.2" />
    <circle cx="220" cy="190" r="2.2" />
    <circle cx="180" cy="70" r="2.2" />
    <circle cx="260" cy="90" r="2.2" />
    <circle cx="340" cy="110" r="2.2" />

    <circle cx="60" cy="219" r="2.2" />
    <circle cx="140" cy="239" r="2.2" />
    <circle cx="220" cy="259" r="2.2" />
    <circle cx="60" cy="287" r="2.2" />
    <circle cx="140" cy="307" r="2.2" />
    <circle cx="220" cy="327" r="2.2" />
    <circle cx="60" cy="355" r="2.2" />
    <circle cx="140" cy="375" r="2.2" />
    <circle cx="220" cy="395" r="2.2" />
  </g>

  <!-- Technical Axis and Extension Lines -->
  <g stroke="#94A3B8" stroke-width="0.7" stroke-dasharray="3,3">
    <line x1="30" y1="355" x2="60" y2="355" />
    <line x1="30" y1="150" x2="60" y2="150" />
    <line x1="35" y1="355" x2="35" y2="150" stroke="#E07A2B" stroke-dasharray="none" stroke-width="1.2" />
    <!-- Dimension arrows -->
    <path d="M32 154 L35 150 L38 154" fill="none" stroke="#E07A2B" stroke-width="1.2" />
    <path d="M32 351 L35 355 L38 351" fill="none" stroke="#E07A2B" stroke-width="1.2" />
  </g>
</svg>
